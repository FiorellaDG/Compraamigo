<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - CompraAmigo</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body data-page="tienda" data-chat="1">
    <header class="app-header" id="site-header"></header>

    <main class="page">
        <h1 class="page-title">🛒 Catálogo CompraAmigo</h1>
        <p class="page-sub">Ropa y accesorios pensados para cuidar tu bolsillo y el planeta.</p>

        <div class="toolbar">
            <input type="search" id="search" placeholder="Buscar productos" aria-label="Buscar productos">
            <select id="sort" aria-label="Ordenar">
                <option value="default">Ordenar por</option>
                <option value="asc">Precio: menor a mayor</option>
                <option value="desc">Precio: mayor a menor</option>
                <option value="co2">Mayor ahorro de CO₂</option>
            </select>
        </div>
        <div class="chips" id="chips"></div>

        <p class="result-count" id="count"></p>
        <div class="grid-products" id="grid"></div>
        <div class="empty-state" id="empty" hidden>
            <div class="big">🔍</div>
            <h3>No encontramos productos</h3>
            <p>Prueba con otra palabra o quita el filtro de categoría.</p>
            <button class="btn" id="clear">Ver todo el catálogo</button>
        </div>
    </main>

    <footer class="app-footer" id="site-footer"></footer>

    <script src="js/app.js"></script>
    <script>
        let cat = "Todos";
        const cats = ["Todos", ...new Set(PRODUCTS.map(p => p.cat))];

        function render() {
            const q = document.getElementById("search").value.trim().toLowerCase();
            const sort = document.getElementById("sort").value;
            let list = PRODUCTS.filter(p =>
                (cat === "Todos" || p.cat === cat) &&
                (p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)));

            if (sort === "asc") list.sort((a, b) => a.price - b.price);
            if (sort === "desc") list.sort((a, b) => b.price - a.price);
            if (sort === "co2") list.sort((a, b) => b.co2 - a.co2);

            document.getElementById("chips").innerHTML = cats.map(c =>
                `<button class="chip ${c === cat ? "active" : ""}" data-cat="${c}">${c}</button>`).join("");
            document.getElementById("count").textContent = list.length + (list.length === 1 ? " producto" : " productos");
            document.getElementById("grid").innerHTML = list.map(productCard).join("");
            document.getElementById("empty").hidden = list.length > 0;
        }

        document.addEventListener("DOMContentLoaded", () => {
            render();
            document.getElementById("search").addEventListener("input", render);
            document.getElementById("sort").addEventListener("change", render);
            document.getElementById("chips").addEventListener("click", e => {
                const c = e.target.closest("[data-cat]");
                if (c) { cat = c.dataset.cat; render(); }
            });
            document.getElementById("clear").addEventListener("click", () => {
                cat = "Todos";
                document.getElementById("search").value = "";
                render();
            });
        });
    </script>
</body>
</html>
